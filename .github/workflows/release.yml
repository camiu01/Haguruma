name: Release

# Conventional Commits on main -> release-please keeps a release PR open with
# the generated CHANGELOG section and the bumped versions (package.json,
# package-lock.json, android versionName). Merging that PR tags the release,
# publishes it, and builds the APK attached to it.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Release PR / tag
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  apk:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/build-apk.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
