name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Bundle size report
        run: |
          ANALYZE=1 npx vite build
          {
            echo '### Bundle size'
            echo '| File | Bytes | Gzip bytes |'
            echo '| --- | ---: | ---: |'
            for f in dist/assets/*.js dist/assets/*.css; do
              echo "| $(basename "$f") | $(wc -c < "$f") | $(gzip -c "$f" | wc -c) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload bundle treemap
        uses: actions/upload-artifact@v7
        with:
          name: bundle-stats
          path: dist/stats.html

  e2e:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: End-to-end smoke test
        run: npm run e2e
