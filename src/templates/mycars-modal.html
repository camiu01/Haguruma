<!-- @file mycars-modal.html -->
<!-- @brief Static application shell fragment. -->
<!-- My Cars bottom-sheet modal -->
	<div id='mycars-modal-backdrop' class='hidden fixed inset-0 z-[80]'></div>
	<div id='mycars-modal' role='dialog' aria-modal='true' aria-labelledby='mycars-modal-title' class='hidden fixed z-[90] bg-surface max-h-[85vh] overflow-y-auto'>
		<div class='sticky top-0 bg-surface z-10 flex items-center justify-between px-5 pt-3 pb-2 border-b border-border'>
			<h2 id='mycars-modal-title' class='text-[0.8125rem] font-semibold text-text-main' data-i18n='custom.title'>My Cars</h2>
			<button id='mycars-modal-close' type='button' class='px-3 py-2 text-xs font-semibold rounded bg-input border border-border text-text-main hover:text-text-output' data-i18n='drawer.close'>Close</button>
		</div>
		<div class='p-5'>
			<div class='grid grid-cols-2 gap-4'>
				<div class='col-span-2'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-name' data-i18n='custom.name'>Car name</label>
					<input type='text' id='custom-name' maxlength='40' placeholder='Eclipse 1G GS race' autocomplete='off' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-tire' data-i18n='primary.tire'>Tire Spec (e.g. 205/55R16)</label>
					<input type='text' id='custom-tire' value='195/60R15' inputmode='text' autocomplete='off' spellcheck='false' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono uppercase focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-fd' data-i18n='primary.fd'>Final Drive (Differential)</label>
					<input type='number' inputmode='decimal' step='0.01' min='1.0' max='10.0' id='custom-fd' value='4.322' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-redline' data-i18n='primary.redline'>Redline RPM</label>
					<input type='number' inputmode='decimal' step='100' min='3000' max='12000' id='custom-redline' value='7000' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-reverse' data-i18n='custom.reverse'>Reverse (optional)</label>
					<input type='number' inputmode='decimal' step='0.01' min='1.0' max='6.0' id='custom-reverse' value='3.083' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-gears' data-i18n='custom.gears'>Gears (comma separated)</label>
					<input type='text' id='custom-gears' value='3.363, 1.947, 1.285, 0.939, 0.756' inputmode='decimal' autocomplete='off' spellcheck='false' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-mass' data-i18n='road.mass'>Vehicle Mass (kg)</label>
					<input type='number' inputmode='decimal' step='10' min='500' max='3000' id='custom-mass' value='1270' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-cd' data-i18n='road.cd'>Drag Coefficient Cd</label>
					<input type='number' inputmode='decimal' step='0.01' min='0.15' max='0.60' id='custom-cd' value='0.29' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-area' data-i18n='road.area'>Frontal Area (m²)</label>
					<input type='number' inputmode='decimal' step='0.05' min='1.0' max='4.0' id='custom-area' value='1.95' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-power'><span data-i18n='road.power'>Engine Power</span> (<span class='power-unit-label'>kW</span>)</label>
					<input type='number' inputmode='decimal' step='5' min='30' max='700' id='custom-power' value='110' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-torque-rpm' data-i18n='engine.torqueRpm'>Peak Torque RPM</label>
					<input type='number' inputmode='decimal' step='100' min='1000' max='12000' id='custom-torque-rpm' value='3500' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-torque' data-i18n='engine.torque'>Peak Torque (Nm)</label>
					<input type='number' inputmode='decimal' step='5' min='50' max='1000' id='custom-torque' value='175' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-power-rpm' data-i18n='engine.powerRpm'>Peak Power RPM</label>
					<input type='number' inputmode='decimal' step='100' min='1000' max='12000' id='custom-power-rpm' value='6500' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-rot-mass' data-i18n='custom.rotMass'>Rotating mass (kg, optional)</label>
					<input type='number' inputmode='decimal' step='10' min='0' max='500' id='custom-rot-mass' placeholder='0' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
				<div class='col-span-2 sm:col-span-1'>
					<label class='block text-xs font-medium text-text-dim mb-1' for='custom-shift-time' data-i18n='custom.shiftTime'>Shift time (s, optional)</label>
					<input type='number' inputmode='decimal' step='0.05' min='0' max='3' id='custom-shift-time' placeholder='0' class='w-full bg-surface-input border border-surface-border focus:border-neon-cyan focus:ring-0 rounded px-3 py-2 text-xs text-text-output font-mono focus:border-text-dim outline-none' />
				</div>
			</div>
			<p id='custom-error' class='text-[0.625rem] text-neon-red mt-2 hidden' data-i18n='custom.invalid'>Check the highlighted fields.</p>
			<div class='mt-3 flex gap-2'>
				<button id='btn-save-custom' type='button' class='flex-1 px-2.5 py-2.5 text-xs bg-surface-input border border-surface-border text-text-main rounded' data-i18n='custom.save'>Save car</button>
				<button id='btn-import-custom' type='button' class='px-2.5 py-2.5 text-xs bg-surface-input border border-surface-border text-text-main rounded' data-i18n='custom.import'>Import JSON</button>
				<input type='file' id='custom-import-input' accept='.json' class='hidden' />
				<button id='btn-import-ini' type='button' class='px-2.5 py-2.5 text-xs bg-surface-input border border-surface-border text-text-main rounded' data-i18n='export.importIni' data-i18n-tip='export.importIniTip' title='Import gears from drivetrain.ini' data-tip='Import gears from drivetrain.ini' aria-label='Import gears from drivetrain.ini'>Import INI</button>
				<input type='file' id='drivetrain-import-input' accept='.ini,.txt' class='hidden' />
			</div>
			<p id='drivetrain-status' class='text-[0.625rem] font-mono text-text-dim mt-2 hidden' role='status'></p>
			<div id='custom-list' class='mt-3 space-y-1.5'></div>
		</div>
	</div>
